<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session board</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --col:#ececea; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6;
          --ask:#b4530a; --work:#1f6feb; --idle:#6b6b66; --closed:#9a9a94; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#232321; --col:#1b1b1a; --ink:#ececea; --muted:#a0a09a; --line:#33332f;
            --ask:#f0a050; --work:#6aa6ff; --idle:#a0a09a; --closed:#77776f; }
  }
  * { box-sizing:border-box }
  [hidden] { display:none !important }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, system-ui, sans-serif;
         display:flex; flex-direction:column }
  header { display:flex; gap:12px 16px; align-items:baseline; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; flex:none }
  h1 { font-size:18px; margin:0 }
  .muted { color:var(--muted) }
  input[type=search] { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); min-width:220px; flex:1 1 220px; max-width:360px }

  /* Tab strip: only shown when one column is visible at a time. */
  nav { display:none; gap:6px; padding:8px 16px 0; overflow-x:auto; flex:none }
  nav button { flex:none; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:14px; padding:4px 10px; font:13px system-ui, sans-serif; cursor:pointer }
  nav button.on { border-color:var(--c); color:var(--c); font-weight:600 }

  /* Columns: side by side, each scrolling on its own. */
  #board { position:relative; flex:1; min-height:0; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:12px; padding:12px 16px 16px }
  .col { display:flex; flex-direction:column; min-height:0; background:var(--col); border-radius:10px; border-top:3px solid var(--c) }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--c); margin:0; padding:10px 12px 6px; flex:none }
  .cards { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 10px 12px }
  .empty { color:var(--muted); font-size:13px; padding:8px 4px }

  /* Narrow screens: one column at a time, swiped left and right. */
  @media (max-width:720px) {
    nav { display:flex }
    #board { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:12px; padding:8px 16px 12px; scrollbar-width:none }
    #board::-webkit-scrollbar { display:none }
    .col { flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always }
    input[type=search] { max-width:none }
  }

  .card { position:relative; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:10px 12px; flex:none }
  .top { display:flex; gap:6px 8px; align-items:center; flex-wrap:wrap; padding-right:24px }
  .x { position:absolute; top:6px; right:6px; width:24px; height:24px; border:0; border-radius:12px; background:transparent; color:var(--muted); font:18px/24px system-ui, sans-serif; cursor:pointer; padding:0 }
  .x:hover { background:var(--col); color:var(--ink) }
  .x:disabled { opacity:.4; cursor:default }
  .card .note { color:var(--ask); font-size:12px; margin-top:6px }
  #notice { color:var(--muted) }
  .name { font-weight:600 }
  .tix span { font-size:11px; padding:1px 6px; border-radius:4px; background:var(--col); margin-right:4px }
  .title { font-size:15px; font-weight:600; margin:6px 0 4px; overflow-wrap:anywhere }
  .away { margin:4px 0; overflow-wrap:anywhere }
  .prompt { color:var(--muted); font-size:13px; margin:4px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere }
  .meta { display:flex; gap:4px 12px; color:var(--muted); font-size:12px; margin-top:8px; flex-wrap:wrap; align-items:center }
  .meta button { font:12px ui-monospace, monospace; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:5px; padding:2px 8px; cursor:pointer }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; margin-top:6px }
  .composer { margin-top:8px; display:flex; flex-direction:column; gap:6px }
  .composer textarea { width:100%; min-height:72px; resize:vertical; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:13px/1.4 -apple-system, system-ui, sans-serif }
  .composer .row { display:flex; gap:8px; align-items:center; justify-content:flex-end }
  .composer .err { color:var(--ask); font-size:12px; margin-right:auto }
  .composer .hint { color:var(--muted); font-size:11px }
  .composer button { border:1px solid var(--c); background:var(--c); color:#fff; border-radius:5px; padding:3px 12px; font:600 12px system-ui, sans-serif; cursor:pointer }
  .composer button:disabled { opacity:.5; cursor:default }
  details pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; max-height:260px; overflow:auto }
</style>
</head>
<body>
<header>
  <h1>Session board</h1>
  <span id="counts" class="muted"></span>
  <input id="q" type="search" placeholder="Filter by name, repo, ticket, text" autocomplete="off">
  <label class="muted"><input type="checkbox" id="showClosed"> show recently closed</label>
  <span id="updated" class="muted"></span>
  <span id="notice"></span>
</header>
<nav id="tabs"></nav>
<main id="board"></main>
<script>
const COLUMNS = [
  { key:"asked you", label:"Waiting on you", colour:"var(--ask)" },
  { key:"working",   label:"Working",        colour:"var(--work)" },
  { key:"idle",      label:"Idle",           colour:"var(--idle)" },
  { key:"closed",    label:"Closed, resumable", colour:"var(--closed)", optional:true },
];
const COLOUR = Object.fromEntries(COLUMNS.map(c => [c.key, c.colour]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = t => { if (!t) return ""; const s = (Date.now() - new Date(t)) / 1000;
  if (s < 90) return Math.round(s) + "s ago"; if (s < 5400) return Math.round(s/60) + " min ago";
  if (s < 172800) return Math.round(s/3600) + " h ago"; return Math.round(s/86400) + " d ago"; };
const when = t => t ? new Date(t).toLocaleString("en-AU", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:false }).replace(/\//g,"-").replace(",", "") : "";

let data = { live:[], closed:[] };
// View state that must survive re-rendering, keyed by session id.
const openReplies = new Set();
const openComposers = new Set();
// sessionId -> { el, body, composer, html }. The element lives as long as the session; only
// its body is re-rendered, so the composer (and anything typed in it) is never rebuilt.
const cards = new Map();
// Published by the server, which owns the condition; a status of `shell` is labelled idle but
// cannot be replied to, so the column must not decide this. See design/concepts/prompt-delivery.md.
const canReply = s => s.live && s.canReply === true;

const board = document.getElementById("board");
const tabs = document.getElementById("tabs");
for (const c of COLUMNS) {
  board.insertAdjacentHTML("beforeend",
    `<section class="col" data-key="${c.key}" style="--c:${c.colour}"><h2></h2><div class="cards"></div><div class="empty">Nothing here.</div></section>`);
  tabs.insertAdjacentHTML("beforeend", `<button data-key="${c.key}" style="--c:${c.colour}"></button>`);
}
const colEl = key => board.querySelector(`.col[data-key="${CSS.escape(key)}"]`);

function cardHtml(s) {
  return `${s.live ? `<button class="x" data-close title="Close this session">×</button>` : ""}<div class="top">
      ${s.name ? `<span class="name">${esc(s.name)}</span>` : ""}
      <span class="muted">${esc(s.repo)}</span>
      <span class="tix">${(s.tickets||[]).map(t => `<span>${esc(t)}</span>`).join("")}</span>
    </div>
    <div class="title">${esc(s.title || s.firstPrompt || "(untitled)")}</div>
    ${s.away ? `<div class="away">${esc(s.away)} <span class="muted">(${ago(s.awayAt)})</span></div>` : ""}
    ${s.lastPrompt ? `<div class="prompt">You last asked: ${esc(s.lastPrompt)}</div>` : ""}
    ${s.lastAssistant ? `<details${openReplies.has(s.sessionId) ? " open" : ""}><summary>Last reply</summary><pre>${esc(s.lastAssistant.slice(-3000))}</pre></details>` : ""}
    <div class="meta">
      <span>last activity ${ago(s.lastAt)}</span>
      ${s.startedAt ? `<span>started ${when(s.startedAt)}</span>` : ""}
      ${s.pid ? `<span>pid ${s.pid}</span>` : ""}
      ${s.live && s.status && s.status !== "idle" && s.status !== "busy" ? `<span>status ${esc(s.status)}</span>` : ""}
      ${s.costUsd != null ? `<span>US$${s.costUsd.toFixed(2)}</span>` : ""}
      <button data-copy="${esc(`claude --resume ${s.sessionId}`)}" title="Copy resume command">copy resume</button>
      ${canReply(s) ? `<button data-reply title="Type a reply into this session's terminal">reply</button>` : ""}
    </div>`;
}

// Returns the card element for a session, re-rendering its body only when its content changed.
function cardFor(s) {
  const html = cardHtml(s);
  let entry = cards.get(s.sessionId);
  if (!entry) {
    const el = document.createElement("article");
    el.className = "card";
    el.dataset.id = s.sessionId;
    el.innerHTML = `<div class="body"></div>
      <div class="note" hidden></div>
      <div class="composer" hidden>
        <textarea placeholder="Reply to this session" aria-label="Reply"></textarea>
        <div class="row"><span class="err"></span><span class="hint">Cmd+Enter</span><button class="send">Send</button></div>
      </div>`;
    entry = { el, body: el.querySelector(".body"), composer: el.querySelector(".composer"), html: null };
    cards.set(s.sessionId, entry);
  }
  entry.el.style.setProperty("--c", COLOUR[s.attention]);
  if (entry.html !== html) { entry.body.innerHTML = html; entry.html = html; }
  entry.composer.hidden = !(canReply(s) && openComposers.has(s.sessionId));
  return entry.el;
}

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const showClosed = document.getElementById("showClosed").checked;
  const match = s => !q || JSON.stringify([s.name,s.repo,s.title,s.away,s.lastPrompt,s.tickets,s.firstPrompt]).toLowerCase().includes(q);
  const byRecent = (x, y) => (y.lastAt||"").localeCompare(x.lastAt||"");
  const all = [...data.live, ...(showClosed ? data.closed : [])];
  const seen = new Set();
  // Replacing or moving a card resets the scroll of its expanded reply, so record and restore it.
  const active = document.activeElement;
  const caret = active?.tagName === "TEXTAREA" ? [active.selectionStart, active.selectionEnd, active.scrollTop] : null;
  const replyScroll = new Map();
  for (const [id, { el }] of cards) { const pre = el.querySelector("details[open] pre"); if (pre) replyScroll.set(id, pre.scrollTop); }

  for (const c of COLUMNS) {
    const col = colEl(c.key), tab = tabs.querySelector(`[data-key="${CSS.escape(c.key)}"]`);
    const visibleCol = !c.optional || showClosed;
    col.hidden = tab.hidden = !visibleCol;
    if (!visibleCol) continue;
    const group = all.filter(s => s.attention === c.key).sort(byRecent);
    const list = col.querySelector(".cards");
    let shown = 0;
    group.forEach((s, i) => {
      const el = cardFor(s);
      seen.add(s.sessionId);
      el.hidden = !match(s);
      if (!el.hidden) shown++;
      if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);
    });
    col.querySelector(".empty").hidden = shown > 0;
    const n = q ? `${shown} of ${group.length}` : `${group.length}`;
    col.querySelector("h2").textContent = `${c.label} (${n})`;
    tab.textContent = `${c.label} ${n}`;
  }
  for (const [id, entry] of cards) if (!seen.has(id)) { entry.el.remove(); cards.delete(id); }
  for (const [id, top] of replyScroll) { const pre = cards.get(id)?.el.querySelector("details[open] pre"); if (pre) pre.scrollTop = top; }
  // Moving a card between columns drops focus from its reply box; put it back.
  if (caret && active.isConnected && document.activeElement !== active) {
    active.focus({ preventScroll:true }); active.setSelectionRange(caret[0], caret[1]); active.scrollTop = caret[2];
  }

  const count = k => data.live.filter(s => s.attention === k).length;
  document.getElementById("counts").textContent =
    `${data.live.length} open: ${count("asked you")} waiting on you, ${count("working")} working, ${count("idle")} idle`;
  markTab();
}

// Highlights the tab for the column in view (narrow screens only).
function markTab() {
  const mid = board.scrollLeft + board.clientWidth / 2;
  let current;
  for (const col of board.querySelectorAll(".col:not([hidden])"))
    if (col.offsetLeft <= mid) current = col.dataset.key;
  for (const b of tabs.children) b.classList.toggle("on", b.dataset.key === current);
}
board.addEventListener("scroll", () => requestAnimationFrame(markTab), { passive:true });
tabs.addEventListener("click", e => {
  const key = e.target.dataset?.key;
  if (key) colEl(key).scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" });
});

// Remember which last replies are expanded.
board.addEventListener("toggle", e => {
  const card = e.target.closest?.(".card");
  if (!card || e.target.tagName !== "DETAILS") return;
  e.target.open ? openReplies.add(card.dataset.id) : openReplies.delete(card.dataset.id);
  const entry = cards.get(card.dataset.id), s = findSession(card.dataset.id);
  if (entry && s) entry.html = cardHtml(s);
}, true);
const findSession = id => data.live.find(s => s.sessionId === id) || data.closed.find(s => s.sessionId === id);

async function refresh() {
  try {
    data = await (await fetch("/api/sessions")).json();
    document.getElementById("updated").textContent = "updated " + when(data.generatedAt);
    render();
  } catch (e) { document.getElementById("updated").textContent = "server not reachable"; }
}
async function sendReply(id) {
  const entry = cards.get(id);
  if (!entry) return;
  const box = entry.composer.querySelector("textarea"), btn = entry.composer.querySelector(".send"), err = entry.composer.querySelector(".err");
  if (!box.value.trim() || btn.disabled) return;
  btn.disabled = true; err.textContent = "sending…";
  try {
    const r = await fetch(`/api/sessions/${encodeURIComponent(id)}/prompt`, {
      method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify({ text: box.value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { box.value = ""; err.textContent = ""; openComposers.delete(id); entry.composer.hidden = true; refresh(); }
    else err.textContent = j.error || `failed (${r.status})`;
  } catch { err.textContent = "server not reachable"; }
  finally { btn.disabled = false; }
}
board.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault(); sendReply(e.target.closest(".card").dataset.id);
  }
});
async function closeSession(id, button) {
  const s = findSession(id), entry = cards.get(id);
  if (!s || !entry) return;
  const note = entry.el.querySelector(".note");
  let confirmed = false;
  if (s.attention !== "idle") {
    const state = s.attention === "working" ? "still working" : "waiting on you";
    if (!confirm(`Close ${s.name || "this session"}? It is ${state}.\n\nIts Claude process will be stopped and its Terminal window closed. You can resume it from the closed column.`)) return;
    confirmed = true;
  }
  button.disabled = true; note.hidden = true;
  try {
    const r = await fetch(`/api/sessions/${encodeURIComponent(id)}/close`, {
      method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify({ confirmed }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) {
      document.getElementById("notice").textContent = `Closed ${s.name || "session"}: ${j.window}.`;
      document.getElementById("showClosed").checked = true;
      await refresh();
    } else { note.textContent = j.error || `failed (${r.status})`; note.hidden = false; }
  } catch { note.textContent = "server not reachable"; note.hidden = false; }
  finally { button.disabled = false; }
}
document.addEventListener("click", e => {
  const card = e.target.closest?.(".card");
  if (card && e.target.matches("[data-close]")) { closeSession(card.dataset.id, e.target); return; }
  if (card && e.target.matches("[data-reply]")) {
    const entry = cards.get(card.dataset.id);
    const open = entry.composer.hidden;
    open ? openComposers.add(card.dataset.id) : openComposers.delete(card.dataset.id);
    entry.composer.hidden = !open;
    if (open) entry.composer.querySelector("textarea").focus();
    return;
  }
  if (card && e.target.matches(".send")) { sendReply(card.dataset.id); return; }
  const v = e.target.dataset?.copy;
  if (v) { navigator.clipboard.writeText(v); e.target.textContent = "copied"; setTimeout(() => e.target.textContent = "copy resume", 1200); }
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("showClosed").addEventListener("change", render);
window.addEventListener("resize", markTab);
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
