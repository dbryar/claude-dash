<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session board</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --col:#ececea; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcdcd6;
          --ask:#b4530a; --work:#1f6feb; --idle:#6b6b66; --closed:#9a9a94; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#232321; --col:#1b1b1a; --ink:#ececea; --muted:#a0a09a; --line:#33332f;
            --ask:#f0a050; --work:#6aa6ff; --idle:#a0a09a; --closed:#77776f; }
  }
  * { box-sizing:border-box }
  [hidden] { display:none !important }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, system-ui, sans-serif;
         display:flex; flex-direction:column }
  header { display:flex; gap:12px 16px; align-items:baseline; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; flex:none }
  h1 { font-size:18px; margin:0 }
  .muted { color:var(--muted) }
  input[type=search] { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); min-width:220px; flex:1 1 220px; max-width:360px }

  /* Tab strip: only shown when one column is visible at a time. */
  nav { display:none; gap:6px; padding:8px 16px 0; overflow-x:auto; flex:none }
  nav button { flex:none; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:14px; padding:4px 10px; font:13px system-ui, sans-serif; cursor:pointer }
  nav button.on { border-color:var(--c); color:var(--c); font-weight:600 }

  /* Columns: side by side, each scrolling on its own. */
  #board { position:relative; flex:1; min-height:0; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:12px; padding:12px 16px 16px }
  .col { display:flex; flex-direction:column; min-height:0; background:var(--col); border-radius:10px; border-top:3px solid var(--c) }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--c); margin:0; padding:10px 12px 6px; flex:none }
  .cards { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 10px 12px }
  .empty { color:var(--muted); font-size:13px; padding:8px 4px }

  /* Narrow screens: one column at a time, swiped left and right. */
  @media (max-width:720px) {
    nav { display:flex }
    #board { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:12px; padding:8px 16px 12px; scrollbar-width:none }
    #board::-webkit-scrollbar { display:none }
    .col { flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always }
    input[type=search] { max-width:none }
  }

  .card { position:relative; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:10px 12px; flex:none }
  .top { display:flex; gap:6px 8px; align-items:center; flex-wrap:wrap; padding-right:52px }
  .acts { position:absolute; top:6px; right:6px; display:flex; gap:2px }
  .x { width:24px; height:24px; border:0; border-radius:12px; background:transparent; color:var(--muted); font:18px/24px system-ui, sans-serif; cursor:pointer; padding:0 }
  .x:hover { background:var(--col); color:var(--ink) }
  .x:disabled { opacity:.4; cursor:default }
  .card .note { color:var(--ask); font-size:12px; margin-top:6px }
  #notice { color:var(--muted) }
  .name { font-weight:600 }
  .tix span { font-size:11px; padding:1px 6px; border-radius:4px; background:var(--col); margin-right:4px }
  .title { font-size:15px; font-weight:600; margin:6px 0 4px; overflow-wrap:anywhere }
  /* Away summary: a hint on the title, on hover, or on focus/tap where there is no pointer. */
  .title.hint { cursor:help; text-decoration:underline dotted var(--muted); text-underline-offset:3px; outline:none }
  .tip { display:none; position:absolute; left:8px; right:8px; z-index:5; margin-top:6px; padding:8px 10px; border-radius:6px;
         background:var(--ink); color:var(--bg); font:400 13px/1.4 -apple-system, system-ui, sans-serif; box-shadow:0 4px 14px rgba(0,0,0,.25) }
  .tip .age { opacity:.7 }
  .title.hint:hover .tip, .title.hint:focus .tip { display:block }
  .prompt { color:var(--muted); font-size:13px; margin:4px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere }
  .meta { display:flex; gap:4px 12px; color:var(--muted); font-size:12px; margin-top:8px; flex-wrap:wrap; align-items:center }
  .meta button { font:12px ui-monospace, monospace; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:5px; padding:2px 8px; cursor:pointer }
  .more { border:0; background:none; padding:0; margin-top:6px; color:var(--work); font:12px system-ui, sans-serif; cursor:pointer }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; margin-top:6px }
  .composer { margin-top:8px; display:flex; flex-direction:column; gap:6px }
  .composer textarea { width:100%; min-height:72px; resize:vertical; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:13px/1.4 -apple-system, system-ui, sans-serif }
  .composer .row { display:flex; gap:8px; align-items:center; justify-content:flex-end }
  .composer .err { color:var(--ask); font-size:12px; margin-right:auto }
  .composer .hint { color:var(--muted); font-size:11px }
  .composer button { border:1px solid var(--c); background:var(--c); color:#fff; border-radius:5px; padding:3px 12px; font:600 12px system-ui, sans-serif; cursor:pointer }
  .composer button:disabled { opacity:.5; cursor:default }
  .asking { margin:8px 0 4px; padding:8px 10px; border-radius:6px; background:var(--col); font-size:13px }
  .asking h3 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--c) }
  .asking .q + .q { margin-top:8px; padding-top:8px; border-top:1px solid var(--line) }
  .asking .qh { font-size:11px; color:var(--muted) }
  .asking .opt { display:flex; gap:8px; align-items:flex-start; margin-top:5px; cursor:pointer }
  .asking .opt input[type=radio], .asking .opt input[type=checkbox] { margin:3px 0 0; flex:none }
  .asking .opt b { font-weight:600 } .asking .opt span { display:block; color:var(--muted); font-size:12px }
  .asking .other { width:100%; margin-top:3px; padding:4px 6px; border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--ink); font:13px system-ui, sans-serif }
  .asking .row { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:8px }
  .asking .err { color:var(--ask); font-size:12px; margin-right:auto } .asking .ok { color:var(--muted); font-size:12px; margin-right:auto }
  .asking button { border:1px solid var(--c); background:var(--c); color:#fff; border-radius:5px; padding:3px 12px; font:600 12px system-ui, sans-serif; cursor:pointer }
  .asking button:disabled { opacity:.5; cursor:default }
  .reply { font-size:13px; max-height:320px; overflow:auto; overflow-wrap:anywhere; margin:6px 0 0 }
  pre.reply { white-space:pre-wrap; font-size:12px }
  .md > :first-child { margin-top:0 } .md > :last-child { margin-bottom:0 }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin:0 0 8px }
  .md ul, .md ol { padding-left:20px } .md li > ul, .md li > ol { margin:2px 0 }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin:10px 0 4px; line-height:1.3 }
  .md h1 { font-size:16px } .md h2 { font-size:15px } .md h3 { font-size:14px } .md h4, .md h5, .md h6 { font-size:13px }
  .md code { font:12px ui-monospace, monospace; background:var(--col); padding:1px 4px; border-radius:4px }
  .md pre { background:var(--col); padding:8px; border-radius:6px; overflow-x:auto }
  .md pre code { background:none; padding:0; white-space:pre }
  .md blockquote { border-left:3px solid var(--line); padding-left:10px; color:var(--muted) }
  .md table { border-collapse:collapse; display:block; overflow-x:auto; font-size:12px }
  .md th, .md td { border:1px solid var(--line); padding:3px 6px; text-align:left; vertical-align:top }
  .md th { background:var(--col) }
  .md hr { border:0; border-top:1px solid var(--line); margin:8px 0 }
  .md a { color:var(--work) }
  /* Session view: one session in a dialog, full screen on narrow screens. See design/concepts/session-view.md. */
  #view { padding:0; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink);
          width:min(1000px, calc(100vw - 32px)); max-width:none; height:90vh; max-height:90vh; box-shadow:0 10px 40px rgba(0,0,0,.35) }
  #view[open] { display:flex; flex-direction:column }
  #view::backdrop { background:rgba(0,0,0,.45) }
  #view .vhead { flex:none; position:relative; padding:10px 16px; border-bottom:1px solid var(--line); border-top:4px solid var(--c); border-radius:10px 10px 0 0 }
  #view .vhead .top { padding-right:32px }
  #view .vhead .acts { top:8px; right:10px }
  #view .lbl { color:var(--c); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em }
  #view .vtools { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12px }
  #view .vtools button { font:12px ui-monospace, monospace; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:5px; padding:2px 8px; cursor:pointer }
  #view .vbody { flex:1; min-height:0; overflow-y:auto; padding:12px 16px }
  #view .vbody .reply { max-height:none; overflow:visible; font-size:14px; margin:0 }
  #view .vbody pre.reply { font-size:13px }
  #view .away, #view .vprompt { color:var(--muted); font-size:13px; margin:0 0 10px; overflow-wrap:anywhere; white-space:pre-wrap }
  #view .vbody .meta { margin:14px 0 0; padding-top:8px; border-top:1px solid var(--line) }
  #view .vfoot { flex:none; max-height:65%; overflow-y:auto; border-top:1px solid var(--line); padding:8px 16px 12px }
  #view .vfoot:empty { display:none }
  #view .vnote { color:var(--muted); font-size:13px }
  #view .vnote:empty { display:none }
  #view .asking { margin-top:0 }
  #view .composer { margin-top:4px }
  #view .composer textarea { resize:none; min-height:calc(6 * 1.4em + 18px); font-size:14px }
  @media (max-width:720px) {
    #view { width:100vw; height:100vh; height:100dvh; max-height:none; margin:0; border:0; border-radius:0 }
    #view .vhead { border-radius:0 }
  }
  header .new { font:600 12px system-ui, sans-serif; border:1px solid var(--work); background:transparent; color:var(--work); border-radius:5px; padding:3px 10px; cursor:pointer }
  #newForm { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 16px; border-bottom:1px solid var(--line); flex:none }
  #newForm select { padding:5px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); font:13px system-ui, sans-serif; max-width:260px }
  #newForm input:disabled { opacity:.7 }
  #newForm input { flex:1 1 280px; max-width:560px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); font:13px ui-monospace, monospace }
  #newForm button { border:1px solid var(--work); background:var(--work); color:#fff; border-radius:5px; padding:4px 12px; font:600 12px system-ui, sans-serif; cursor:pointer }
  #newForm button.cancel { background:transparent; color:var(--muted); border-color:var(--line) }
  #newForm button:disabled { opacity:.5; cursor:default }
  #newForm .err { color:var(--ask); font-size:12px }
</style>
</head>
<body>
<header>
  <h1>Session board</h1>
  <button id="newBtn" class="new" title="Start claude in a new Terminal tab">new session</button>
  <span id="counts" class="muted"></span>
  <input id="q" type="search" placeholder="Filter by name, repo, ticket, text" autocomplete="off">
  <label class="muted"><input type="checkbox" id="showClosed"> show recently closed</label>
  <label class="muted"><input type="checkbox" id="mdOn" checked> formatted replies</label>
  <span id="updated" class="muted"></span>
  <span id="notice"></span>
</header>
<form id="newForm" hidden autocomplete="off">
  <select id="newWhich" aria-label="Session"><option value="">New session</option></select>
  <label class="muted" for="newDir">in</label>
  <input id="newDir" list="dirs" placeholder="/path/to/project" spellcheck="false" required>
  <datalist id="dirs"></datalist>
  <select id="newMode" aria-label="Permissions" title="Permission mode for the session">
    <option value="auto">Auto</option>
    <option value="skip">Skip all prompts</option>
    <option value="ask">Ask for each tool</option>
  </select>
  <button type="submit" id="newStart">Start</button>
  <button type="button" class="cancel" id="newCancel">Cancel</button>
  <span class="err"></span>
</form>
<nav id="tabs"></nav>
<main id="board"></main>
<dialog id="view" aria-labelledby="viewTitle">
  <div class="vhead">
    <div class="acts"><button class="x" data-vclose title="Close (Esc)" aria-label="Close">×</button></div>
    <div class="vh"></div>
    <div class="vtools">
      <label class="muted"><input type="checkbox" id="mdOnView"> formatted reply</label>
      <button data-vcopy title="Copy the whole reply as Markdown">copy reply</button>
    </div>
  </div>
  <div class="vbody"></div>
  <div class="vfoot"><div class="vnote"></div></div>
</dialog>
<script>
const COLUMNS = [
  { key:"asked you", label:"Waiting on you", colour:"var(--ask)" },
  { key:"working",   label:"Working",        colour:"var(--work)" },
  { key:"idle",      label:"Idle",           colour:"var(--idle)" },
  { key:"closed",    label:"Closed, resumable", colour:"var(--closed)", optional:true },
];
const COLOUR = Object.fromEntries(COLUMNS.map(c => [c.key, c.colour]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = t => { if (!t) return ""; const s = (Date.now() - new Date(t)) / 1000;
  if (s < 90) return Math.round(s) + "s ago"; if (s < 5400) return Math.round(s/60) + " min ago";
  if (s < 172800) return Math.round(s/3600) + " h ago"; return Math.round(s/86400) + " d ago"; };
// Last replies are Markdown. Every piece of text is escaped before any tag is added, so nothing in
// a reply becomes live HTML. See design/concepts/dashboard-ui.md, criteria 22 to 25.
const MD_BLOCK = /^\s*(```|#{1,6}\s|>|([-*+]|\d+[.)])\s|\|.*\|\s*$|([-*_])(\s*\3){2,}\s*$)/;
function mdInline(t) {
  const codes = [];
  t = esc(t).replace(/`([^`]+)`/g, (_, c) => `${codes.push(c) - 1}`);
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
       .replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(?=\S)(.+?)__/g, "<strong>$1</strong>")
       .replace(/(^|[^*\w])\*(?=\S)(.+?)\*(?!\w)/g, "$1<em>$2</em>").replace(/(^|[^_\w])_(?=\S)(.+?)_(?!\w)/g, "$1<em>$2</em>")
       .replace(/~~(?=\S)(.+?)~~/g, "<del>$1</del>");
  return t.replace(/(\d+)/g, (_, n) => `<code>${codes[n]}</code>`);
}
function md(src) {
  const lines = src.split("\n"), out = [];
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  let i = 0, m;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^\s*```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if ((m = l.match(/^\s*(#{1,6})\s+(.*?)\s*#*\s*$/))) { out.push(`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i + 1] ?? "")) {
      let h = `<table><thead><tr>${cells(l).map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>`;
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) h += `<tr>${cells(lines[i++]).map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`;
      out.push(h + "</tbody></table>"); continue;
    }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*> ?/, ""));
      out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const stack = []; let h = "";
      while (i < lines.length) {
        const li = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (!li) {
          if (stack.length && /^\s{2,}\S/.test(lines[i])) { h += " " + mdInline(lines[i++].trim()); continue; }
          break;
        }
        const ind = li[1].length, ol = /\d/.test(li[2]), tag = ol ? "ol" : "ul";
        while (stack.length && ind < stack.at(-1).ind) h += `</li></${stack.pop().tag}>`;
        // A bulleted list followed by a numbered one at the same depth is two lists.
        if (stack.length && ind === stack.at(-1).ind && stack.at(-1).tag !== tag) h += `</li></${stack.pop().tag}>`;
        if (!stack.length || ind > stack.at(-1).ind) {
          stack.push({ ind, tag });
          h += ol && parseInt(li[2]) !== 1 ? `<ol start="${parseInt(li[2])}"><li>` : `<${tag}><li>`;
        } else h += "</li><li>";
        h += mdInline(li[3]); i++;
      }
      while (stack.length) h += `</li></${stack.pop().tag}>`;
      out.push(h); continue;
    }
    const buf = [l.trim()]; i++;
    while (i < lines.length && lines[i].trim() && !MD_BLOCK.test(lines[i])) buf.push(lines[i++].trim());
    out.push(`<p>${buf.map(mdInline).join("<br>")}</p>`);
  }
  return out.join("");
}
// The last 3,000 characters, starting at a line, and still inside a code block if the cut fell in one.
function replyTail(s) {
  s = s.replace(/\r\n?/g, "\n").trim();
  if (s.length <= 3000) return s;
  let t = s.slice(-3000); t = t.slice(t.indexOf("\n") + 1);
  if ((t.match(/^\s*```/gm) || []).length % 2) t = "```\n" + t;
  return "…\n" + t;
}
let mdOn = true;
try { mdOn = localStorage.getItem("sessionBoard.md") !== "off"; } catch {}
document.getElementById("mdOn").checked = mdOn;
const replyHtml = s => mdOn ? `<div class="reply md">${md(replyTail(s))}</div>` : `<pre class="reply">${esc(replyTail(s))}</pre>`;
const replyFullHtml = s => { s = s.replace(/\r\n?/g, "\n").trim(); return mdOn ? `<div class="reply md">${md(s)}</div>` : `<pre class="reply">${esc(s)}</pre>`; };
const isLong = s => s.replace(/\r\n?/g, "\n").trim().length > 3000;

const when = t => t ? new Date(t).toLocaleString("en-AU", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:false }).replace(/\//g,"-").replace(",", "") : "";

let data = { live:[], closed:[] };
// View state that must survive re-rendering, keyed by session id.
const openReplies = new Set();
const openComposers = new Set();
// sessionId -> { el, body, composer, html }. The element lives as long as the session; only
// its body is re-rendered, so the composer (and anything typed in it) is never rebuilt.
const cards = new Map();
// Published by the server, which owns the condition; a status of `shell` is labelled idle but
// cannot be replied to, so the column must not decide this. See design/concepts/prompt-delivery.md.
const canReply = s => s.live && s.canReply === true;

const board = document.getElementById("board");
const tabs = document.getElementById("tabs");
for (const c of COLUMNS) {
  board.insertAdjacentHTML("beforeend",
    `<section class="col" data-key="${c.key}" style="--c:${c.colour}"><h2></h2><div class="cards"></div><div class="empty">Nothing here.</div></section>`);
  tabs.insertAdjacentHTML("beforeend", `<button data-key="${c.key}" style="--c:${c.colour}"></button>`);
}
const colEl = key => board.querySelector(`.col[data-key="${CSS.escape(key)}"]`);

function cardHtml(s) { return headHtml(s) + "\u0000" + bodyHtml(s); }
function headHtml(s) {
  return `<div class="acts"><button class="x" data-open title="Open the full session view" aria-label="Open">⤢</button>${s.live ? `<button class="x" data-close title="Close this session">×</button>` : ""}</div><div class="top">
      ${s.name ? `<span class="name">${esc(s.name)}</span>` : ""}
      <span class="muted">${esc(s.repo)}</span>
      <span class="tix">${(s.tickets||[]).map(t => `<span>${esc(t)}</span>`).join("")}</span>
    </div>
    ${s.away
      ? `<div class="title hint" tabindex="0">${esc(s.title || s.firstPrompt || "(untitled)")}<div class="tip">${esc(s.away)} <span class="age">(${ago(s.awayAt)})</span></div></div>`
      : `<div class="title">${esc(s.title || s.firstPrompt || "(untitled)")}</div>`}`;
}
function bodyHtml(s) {
  return `${s.lastPrompt ? `<div class="prompt">You last asked: ${esc(s.lastPrompt)}</div>` : ""}
    ${s.lastAssistant ? `<details${openReplies.has(s.sessionId) ? " open" : ""}><summary>Last reply</summary>${replyHtml(s.lastAssistant)}${isLong(s.lastAssistant) ? `<button class="more" data-open>show full reply</button>` : ""}</details>` : ""}
    ${metaHtml(s, false)}`;
}

// The answer form for the question menu a session is showing, read by the server from its terminal.

function render() {

  const byRecent = (x, y) => (y.lastAt||"").localeCompare(x.lastAt||"");

// Highlights the tab for the column in view (narrow screens only).

  if (e.target.matches("[data-vclose]")) { viewEl.close(); return; }
  if (e.target.matches("[data-vcopy]") && view.s?.lastAssistant) {
    navigator.clipboard.writeText(view.s.lastAssistant);
    e.target.textContent = "copied"; setTimeout(() => e.target.textContent = "copy reply", 1200);
  }
});
window.addEventListener("resize", markTab);
refresh(); setInterval(refresh, 5000);
</script>
