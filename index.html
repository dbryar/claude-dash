<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session board</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dd;
          --ask:#b4530a; --work:#1f6feb; --idle:#6b6b66; --closed:#9a9a94; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#1f1f1d; --ink:#ececea; --muted:#a0a09a; --line:#33332f;
            --ask:#f0a050; --work:#6aa6ff; --idle:#a0a09a; --closed:#77776f; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, system-ui, sans-serif }
  header { display:flex; gap:16px; align-items:baseline; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap }
  h1 { font-size:18px; margin:0 }
  .muted { color:var(--muted) }
  input { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); min-width:240px }
  main { padding:16px 20px; max-width:1500px }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 8px }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:12px }
  .card { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:12px 14px }
  .top { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .name { font-weight:600 }
  .chip { font-size:11px; padding:1px 8px; border-radius:10px; border:1px solid var(--c); color:var(--c) }
  .tix span { font-size:11px; padding:1px 6px; border-radius:4px; background:var(--line); margin-right:4px }
  .title { font-size:15px; font-weight:600; margin:6px 0 4px }
  .away { margin:4px 0 }
  .prompt { color:var(--muted); font-size:13px; margin:4px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  .meta { display:flex; gap:12px; color:var(--muted); font-size:12px; margin-top:8px; flex-wrap:wrap; align-items:center }
  button { font:12px ui-monospace, monospace; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:5px; padding:2px 8px; cursor:pointer }
  details summary { cursor:pointer; color:var(--muted); font-size:12px }
  details pre { white-space:pre-wrap; font-size:12px; max-height:260px; overflow:auto }
  @media (max-width:520px) { .grid { grid-template-columns:1fr } main,header { padding:12px 16px } }
</style>
</head>
<body>
<header>
  <h1>Session board</h1>
  <span id="counts" class="muted"></span>
  <input id="q" placeholder="Filter by name, repo, ticket, text" autocomplete="off">
  <label class="muted"><input type="checkbox" id="showClosed"> show closed (last 7 days)</label>
  <span id="updated" class="muted"></span>
</header>
<main id="root"></main>
<script>
const COLOURS = { "asked you":"var(--ask)", working:"var(--work)", idle:"var(--idle)", closed:"var(--closed)" };
const ORDER = ["asked you","working","idle"];
const LABEL = { "asked you":"Waiting on you", working:"Working", idle:"Idle", closed:"Closed, resumable" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = t => { if (!t) return ""; const s = (Date.now() - new Date(t)) / 1000;
  if (s < 90) return Math.round(s) + "s ago"; if (s < 5400) return Math.round(s/60) + " min ago";
  if (s < 172800) return Math.round(s/3600) + " h ago"; return Math.round(s/86400) + " d ago"; };
const when = t => t ? new Date(t).toLocaleString("en-AU", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:false }).replace(/\//g,"-") : "";
let data = { live:[], closed:[] };

function card(s) {
  const c = COLOURS[s.attention];
  const resume = `claude --resume ${s.sessionId}`;
  return `<div class="card" style="--c:${c}">
    <div class="top">
      ${s.name ? `<span class="name">${esc(s.name)}</span>` : ""}
      <span class="muted">${esc(s.repo)}</span>
      <span class="chip">${esc(LABEL[s.attention])}</span>
      <span class="tix">${(s.tickets||[]).map(t => `<span>${esc(t)}</span>`).join("")}</span>
    </div>
    <div class="title">${esc(s.title || s.firstPrompt || "(untitled)")}</div>
    ${s.away ? `<div class="away">${esc(s.away)} <span class="muted">(${ago(s.awayAt)})</span></div>` : ""}
    ${s.lastPrompt ? `<div class="prompt">You last asked: ${esc(s.lastPrompt)}</div>` : ""}
    ${s.lastAssistant ? `<details><summary>Last reply</summary><pre>${esc(s.lastAssistant.slice(-3000))}</pre></details>` : ""}
    <div class="meta">
      <span>last activity ${ago(s.lastAt)}</span>
      ${s.startedAt ? `<span>started ${when(s.startedAt)}</span>` : ""}
      ${s.pid ? `<span>pid ${s.pid}</span>` : ""}
      ${s.costUsd != null ? `<span>US$${s.costUsd.toFixed(2)}</span>` : ""}
      <button data-copy="${esc(resume)}" title="Copy resume command">copy resume</button>
    </div>
  </div>`;
}

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const match = s => !q || JSON.stringify([s.name,s.repo,s.title,s.away,s.lastPrompt,s.tickets,s.firstPrompt]).toLowerCase().includes(q);
  const live = data.live.filter(match);
  let html = "";
  for (const a of ORDER) {
    const group = live.filter(s => s.attention === a).sort((x,y) => (y.lastAt||"").localeCompare(x.lastAt||""));
    if (group.length) html += `<h2>${LABEL[a]} (${group.length})</h2><div class="grid">${group.map(card).join("")}</div>`;
  }
  if (document.getElementById("showClosed").checked) {
    const closed = data.closed.filter(match);
    html += `<h2>${LABEL.closed} (${closed.length})</h2><div class="grid">${closed.map(card).join("")}</div>`;
  }
  document.getElementById("root").innerHTML = html || `<p class="muted">No sessions match.</p>`;
  const n = a => data.live.filter(s => s.attention === a).length;
  document.getElementById("counts").textContent = `${data.live.length} open: ${n("asked you")} waiting on you, ${n("working")} working, ${n("idle")} idle`;
}

async function refresh() {
  try {
    data = await (await fetch("/api/sessions")).json();
    document.getElementById("updated").textContent = "updated " + when(data.generatedAt);
    render();
  } catch (e) { document.getElementById("updated").textContent = "server not reachable"; }
}
document.addEventListener("click", e => { const v = e.target.dataset?.copy; if (v) { navigator.clipboard.writeText(v); e.target.textContent = "copied"; setTimeout(() => e.target.textContent = "copy resume", 1200); } });
document.getElementById("q").addEventListener("input", render);
document.getElementById("showClosed").addEventListener("change", render);
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
